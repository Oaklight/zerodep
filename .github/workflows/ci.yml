name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core test dependencies
        run: pip install pytest pytest-asyncio pytest-benchmark
      - name: Install reference libraries for cross-validation
        continue-on-error: true
        run: |
          pip install pycryptodome==3.23.0 qrcode==8.2 Pillow==12.2.0 \
            httpx==0.28.1 python-dotenv==1.2.2 PyYAML==6.0.3 \
            commentjson==0.9.0 "structlog==25.5.0" \
            "tenacity==9.1.4" "tabulate==0.10.0" "beautifulsoup4==4.14.3" \
            "pydantic==2.13.0" "httpx-sse==0.4.3" "mistune==3.2.0" \
            "unidiff==0.7.5" "APScheduler==3.11.2" "schedule==1.2.2" \
            "croniter==6.2.2" "rank-bm25==0.2.2" "python-frontmatter==1.1.0" \
            "python-decouple==3.8" "cachetools==7.0.5" "xmltodict==1.0.4" \
            "jsonrpcserver==5.0.9" "protobuf==7.34.1" "packaging==26.1" \
            "sqlitedict==2.1.0" "sh==2.2.2"
          pip install "toon_format @ git+https://github.com/toon-format/toon-python.git" || true
          pip install "a2a-protocol==0.1.0" || true
          pip install "agent-client-protocol==0.9.0" || true
      - name: Run correctness tests
        run: pytest --ignore-glob="*/test_*_benchmark.py" -v
