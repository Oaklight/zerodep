name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core test dependencies
        run: pip install pytest pytest-asyncio pytest-benchmark
      - name: Install reference libraries for cross-validation
        continue-on-error: true
        run: |
          # Dynamically extract all bench-* extras from pyproject.toml
          # (bench-toon excluded — only available from git, installed separately)
          BENCH_EXTRAS=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          extras = [k for k in data['project']['optional-dependencies']
                    if k.startswith('bench-') and k != 'bench-toon']
          print(','.join(extras))
          ")
          echo "Installing extras: $BENCH_EXTRAS"
          pip install ".[$BENCH_EXTRAS]"
          pip install "toon_format @ git+https://github.com/toon-format/toon-python.git" || true
      - name: Run correctness tests
        run: pytest --ignore-glob="*/test_*_benchmark.py" -v
