[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["zerodep"]

[project]
name = "zerodep"
version = "2026.4.25"
description = "Zero-dependency, single-file Python implementations of popular libraries"
authors = [{ name = "Peng Ding" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
zerodep = "zerodep:main"

[project.urls]
Documentation = "https://zerodep.readthedocs.io"
Repository = "https://github.com/Oaklight/zerodep"
Issues = "https://github.com/Oaklight/zerodep/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
]
# Reference libraries for correctness and benchmark comparisons
# Versions are pinned to ensure reproducible benchmark results.
bench-aes = [
    "pycryptodome==3.23.0",
]
bench-qr = [
    "qrcode==8.2",
    "Pillow==12.2.0",
]
bench-http = [
    "httpx==0.28.1",
]
bench-dotenv = [
    "python-dotenv==1.2.2",
]
bench-yaml = [
    "PyYAML==6.0.3",
]
bench-jsonc = [
    "commentjson==0.9.0",
]
bench-structlog = [
    "structlog==25.5.0",
]
bench-retry = [
    "tenacity==9.1.4",
]
bench-toon = [
    "toon-format>=0.9.0b1",
]
bench-tabulate = [
    "tabulate==0.10.0",
]
bench-soup = [
    "beautifulsoup4==4.14.3",
]
bench-validate = [
    "pydantic==2.13.0",
]
bench-sse = [
    "httpx-sse==0.4.3",
    "httpx==0.28.1",
]
bench-markdown = [
    "mistune==3.2.0",
]
bench-diff = [
    "unidiff==0.7.5",
]
bench-scheduler = [
    "APScheduler==3.11.2",
    "schedule==1.2.2",
    "croniter==6.2.2",
]
bench-search = [
    "rank-bm25==0.2.2",
]
bench-frontmatter = [
    "python-frontmatter==1.1.0",
]
bench-config = [
    "python-decouple==3.8",
]
bench-cache = [
    "cachetools==7.0.5",
]
bench-xml = [
    "xmltodict==1.0.4",
]
bench-jsonrpc = [
    "jsonrpcserver==5.0.9",
]
bench-protobuf = [
    "protobuf==7.34.1",
]
bench-a2a = [
    "a2a-protocol==0.1.0",
]
bench-acp = [
    "agent-client-protocol==0.9.0",
]
bench-semver = [
    "packaging==26.1",
]
bench-persistdict = [
    "sqlitedict==2.1.0",
]
bench-runner = [
    "sh==2.2.2",
]
bench-readability = [
    "readability-lxml==0.8.4.1",
]
dev = [
    "ruff>=0.1.0",
    "ty>=0.0.24",
    "complexipy>=5.2.0",
    "build>=1.2.2.post1",
    "twine>=6.1.0",
    "zerodep[test,bench-aes,bench-qr,bench-http,bench-dotenv,bench-yaml,bench-jsonc,bench-structlog,bench-retry,bench-toon,bench-tabulate,bench-soup,bench-validate,bench-sse,bench-markdown,bench-diff,bench-scheduler,bench-search,bench-frontmatter,bench-config,bench-cache,bench-xml,bench-jsonrpc,bench-a2a,bench-acp,bench-protobuf,bench-semver,bench-persistdict,bench-runner,bench-readability]",
]

[tool.pytest.ini_options]
testpaths = ["aes", "qr", "httpclient", "dotenv", "yaml", "jsonc", "structlog", "retry", "toon", "tabulate", "soup", "prompt", "validate", "sse", "markdown", "diff", "vcs", "ansi", "scheduler", "sparse_search", "frontmatter", "config", "cache", "runner", "xml", "jsonrpc", "a2a", "acp", "skills", "filelock", "persistdict", "protobuf", "depdetect", "semver", "readability", "jsonschema"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"aes/aes.py" = ["E501"]
"aes/aes_python.py" = ["E501"]
"qr/qr.py" = ["E501"]
"yaml/yaml.py" = ["E501"]
"validate/validate.py" = ["E501"]
"diff/diff.py" = ["E501"]
"vcs/vcs.py" = ["E501"]
"xml/xml.py" = ["E501"]
"a2a/a2a.py" = ["E501"]
"acp/acp.py" = ["E501"]
"jsonschema/jsonschema.py" = ["E501"]
"**/test_*.py" = ["E402"]
"**/test_*_benchmark.py" = ["E501"]
"**/conftest.py" = ["C901"]

[tool.complexipy]
paths = ["."]
max-complexity-allowed = 20
exclude = ["**/test_*.py", "**/test_*_benchmark.py"]

[tool.ty.environment]
extra-paths = [
    "./aes",
    "./ansi",
    "./diff",
    "./dotenv",
    "./httpclient",
    "./jsonc",
    "./markdown",
    "./prompt",
    "./qr",
    "./retry",
    "./soup",
    "./sse",
    "./structlog",
    "./tabulate",
    "./toon",
    "./validate",
    "./vcs",
    "./yaml",
    "./scheduler",
    "./sparse_search",
    "./frontmatter",
    "./config",
    "./cache",
    "./runner",
    "./xml",
    "./jsonrpc",
    "./a2a",
    "./acp",
    "./skills",
    "./filelock",
    "./persistdict",
    "./protobuf",
    "./depdetect",
    "./semver",
    "./jsonschema",
]
