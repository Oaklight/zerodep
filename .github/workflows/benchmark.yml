name: Benchmark

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to benchmark (tag, branch, or SHA)"
        required: false
        default: ""

permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and reference libraries
        continue-on-error: true
        run: |
          # Extract all bench-* extra names from pyproject.toml and install them
          # bench-toon is excluded because toon_format >= 0.9.0b1 is only available
          # from git, not PyPI — it is installed separately below.
          BENCH_EXTRAS=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          extras = [k for k in data['project']['optional-dependencies']
                    if k.startswith('bench-') and k != 'bench-toon']
          print(','.join(['test'] + extras))
          ")
          echo "Installing extras: $BENCH_EXTRAS"
          pip install ".[$BENCH_EXTRAS]"
          # toon_format pre-release only available from git
          pip install "toon_format @ git+https://github.com/toon-format/toon-python.git" || true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install readability JS dependencies
        run: cd readability && npm install --prefer-offline --no-audit

      - name: Install jsonschema JS dependencies
        run: cd jsonschema && npm install --prefer-offline --no-audit

      - name: Check module versions
        continue-on-error: true
        run: python -m zerodep version-check

      - name: Run benchmarks
        run: |
          pytest --ignore-glob="*/test_*_correctness.py" \
                 --ignore-glob=".claude/*" \
                 --benchmark-json=benchmark-results.json \
                 --benchmark-only -q \
                 || true
          # Verify results were produced (pytest may exit non-zero on flaky tests)
          test -s benchmark-results.json

      - name: Run readability three-way comparison
        continue-on-error: true
        run: python readability/benchmark_compare.py --rounds 10

      - name: Determine benchmark name
        id: bench-name
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "name=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ steps.bench-name.outputs.name }}
          path: benchmark-results.json

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "pytest"
          output-file-path: benchmark-results.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "300%"
          comment-on-alert: true
          fail-on-alert: false

      - name: Generate comparison report
        run: |
          python _scripts/generate_bench_report.py \
            benchmark-results.json \
            bench-output/index.html \
            "${{ steps.bench-name.outputs.name }}" \
            "${{ github.sha }}"

      - name: Publish report to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add gh-pages-wt gh-pages
          mkdir -p gh-pages-wt/dev/bench/modules
          cp bench-output/index.html gh-pages-wt/dev/bench/index.html
          cp bench-output/history.html gh-pages-wt/dev/bench/history.html
          cp bench-output/modules/*.html gh-pages-wt/dev/bench/modules/
          cd gh-pages-wt
          git add dev/bench/index.html dev/bench/history.html dev/bench/modules/
          if git diff --cached --quiet; then
            echo "No changes to report"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update benchmark report for ${{ steps.bench-name.outputs.name }}"
            git push origin gh-pages
          fi
          cd ..
          git worktree remove gh-pages-wt
