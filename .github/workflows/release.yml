name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty for auto CalVer YYYY.M.D)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  quality:
    # The reusable workflow only reads the repository; do not hand it (or
    # the caller) write scopes.
    permissions:
      contents: read
    uses: ./.github/workflows/lint-test.yml
    with:
      python-versions: '["3.12"]'

  release:
    needs: quality
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      republish: ${{ steps.version.outputs.republish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="$(date +%Y.%-m.%-d)"
          fi
          REPUBLISH=false
          if git tag -l "v${VER}" | grep -q .; then
            if [ -n "${{ github.event.inputs.version }}" ]; then
              # An explicit version whose tag exists means "re-run the
              # publish for this release", not "cut a new one".
              REPUBLISH=true
              echo "Tag v${VER} already exists; publishing it to PyPI only"
            else
              echo "::error::Tag v${VER} already exists (pass an explicit version to re-publish)"
              exit 1
            fi
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "republish=${REPUBLISH}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VER} (republish=${REPUBLISH})"

      - name: Check module versions
        if: steps.version.outputs.republish != 'true'
        run: |
          python -m zerodep version-check --strict

      - name: Regenerate manifest
        if: steps.version.outputs.republish != 'true'
        run: |
          python -m zerodep manifest

      - name: Bump project version
        if: steps.version.outputs.republish != 'true'
        run: |
          VER="${{ steps.version.outputs.version }}"
          sed -i "s/^version = .*/version = \"${VER}\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"${VER}\"/" zerodep.py

      - name: Commit and tag
        if: steps.version.outputs.republish != 'true'
        run: |
          VER="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "release: v${VER}"
          fi
          git tag "v${VER}"
          git push origin master --tags

      - name: Create GitHub Release
        if: steps.version.outputs.republish != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          gh release create "v${VER}" \
            --title "v${VER}" \
            --generate-notes

  benchmark:
    needs: release
    if: needs.release.outputs.republish != 'true'
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Trigger benchmark
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ needs.release.outputs.version }}"
          # No fallback: the cascade used to fail silently on a missing
          # actions: write scope, so a red benchmark never appeared. Its own
          # job, so a transient API failure cannot skip the PyPI publish.
          # -R is required: this job has no checkout, so gh cannot infer
          # the repository from a working tree.
          gh workflow run benchmark.yml --ref "v${VER}" -R "$GITHUB_REPOSITORY"

  pypi:
    needs: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Build the tree the release commit/tag points at. Without the ref,
          # checkout uses the dispatch SHA, so the artifact carries the
          # previous version.
          ref: v${{ needs.release.outputs.version }}

      - name: Check whether this version is already on PyPI
        id: pypi
        run: |
          VER="${{ needs.release.outputs.version }}"
          if curl -fsS "https://pypi.org/pypi/zerodep/${VER}/json" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::zerodep ${VER} is already on PyPI; nothing to publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for CLI changes
        id: check
        run: |
          if [ "${{ steps.pypi.outputs.exists }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT_TAG="v${{ needs.release.outputs.version }}"
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -1)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found — first release, publishing"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing ${PREV_TAG}..${CURRENT_TAG}"

          CLI_DIFF=$(git diff "$PREV_TAG".."$CURRENT_TAG" -- zerodep.py \
            | grep '^[+-]' | grep -v '^[+-][+-][+-]' | grep -v '__version__' || true)
          TOML_DIFF=$(git diff "$PREV_TAG".."$CURRENT_TAG" -- pyproject.toml \
            | grep '^[+-]' | grep -v '^[+-][+-][+-]' | grep -v '^[+-]version = ' || true)

          if [ -n "$CLI_DIFF" ] || [ -n "$TOML_DIFF" ]; then
            echo "Substantive changes detected:"
            echo "--- zerodep.py diff (excluding version) ---"
            echo "$CLI_DIFF"
            echo "--- pyproject.toml diff (excluding version) ---"
            echo "$TOML_DIFF"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only version bumps — skipping PyPI publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        if: steps.check.outputs.changed == 'true'
        run: |
          pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
