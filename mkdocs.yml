site_name: zerodep
site_description: Zero-dependency, single-file Python implementations of popular libraries
site_author: Peng Ding
site_url: https://zerodep.readthedocs.io/en/
repo_name: Oaklight/zerodep
repo_url: https://github.com/Oaklight/zerodep
copyright: Copyright &copy; 2026 Peng Ding

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ../aes
            - ../qr
            - ../httpclient
            - ../dotenv
            - ../yaml
            - ../jsonc
            - aes
            - qr
            - httpclient
            - dotenv
            - yaml
            - jsonc
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Oaklight/zerodep
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: "中文"
      link: /zh-cn/
      lang: zh

nav:
  - Home: index.md
  - Modules:
      - AES: modules/aes.md
      - QR Code: modules/qr.md
      - HTTP Client: modules/http.md
      - Dotenv: modules/dotenv.md
      - YAML: modules/yaml.md
      - JSONC: modules/jsonc.md
  - API Reference:
      - AES: api/aes.md
      - QR Code: api/qr.md
      - HTTP Client: api/http.md
      - Dotenv: api/dotenv.md
      - YAML: api/yaml.md
      - JSONC: api/jsonc.md
  - Benchmarks:
      - AES: benchmarks/aes.md
      - QR Code: benchmarks/qr.md
      - HTTP Client: benchmarks/http.md
      - Dotenv: benchmarks/dotenv.md
      - YAML: benchmarks/yaml.md
      - JSONC: benchmarks/jsonc.md
  - Changelog: changelog.md
