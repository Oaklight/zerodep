version: "3.9"

x-common-env: &common-env
  TZ: UTC
  LOG_LEVEL: info

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12"
        BUILD_ENV: production
    image: myapp:latest
    container_name: myapp-web
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8443:8443"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://app:${DB_PASSWORD}@postgres:5432/myapp
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: "localhost,example.com,*.example.com"
      CORS_ORIGINS: >-
        http://localhost:3000,
        https://example.com,
        https://app.example.com
    volumes:
      - ./src:/app/src:ro
      - media_data:/app/media
      - static_data:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - frontend
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    command: celery -A myapp worker -l info --concurrency=4
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://app:${DB_PASSWORD}@postgres:5432/myapp
      REDIS_URL: redis://redis:6379/0
      C_FORCE_ROOT: "true"
    depends_on:
      - postgres
      - redis
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d myapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    shm_size: 256mb

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - backend

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_data:/usr/share/nginx/static:ro
      - certbot_data:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - frontend

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  media_data:
  static_data:
  certbot_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
