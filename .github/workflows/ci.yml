name: CI

on:
  push:
    branches: [master]
  # No base-branch filter. With `branches: [master]` a pull request stacked on
  # another branch matched no trigger at all, so it got no run and no checks --
  # which reads as "not started" rather than "never ran", and a stacked head
  # then needed `gh workflow run ci.yml --ref <branch>` to be verified at all.
  # Stacked PRs are a supported workflow here (submit-workflow.md), and a
  # stacked PR costs the same matrix as any other.
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/lint-test.yml

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required: module-versions compares each module against its
          # declared version tag. A shallow clone has no tags, so the check
          # would classify everything as up to date and check nothing.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the pre-release checks
        # The same command the Release workflow runs before tagging. Lint and
        # tests already have their own jobs, so --with-lint/--with-tests stay
        # off here. A fresh checkout is clean, so the working-tree check is a
        # real gate rather than noise.
        run: python -m zerodep release-check
