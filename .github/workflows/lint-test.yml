name: Lint & Test

on:
  workflow_call:
    inputs:
      python-versions:
        description: "JSON array of Python versions to test"
        type: string
        default: '["3.10", "3.11", "3.12", "3.13"]'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core test dependencies
        run: pip install pytest pytest-asyncio pytest-benchmark
      - name: Install reference libraries for cross-validation
        continue-on-error: true
        run: |
          # Dynamically extract all bench-* extras from pyproject.toml.
          # The TOON reference is not an extra (PyPI forbids the direct URL
          # in published metadata); it is installed in its own required step.
          pip install tomli
          BENCH_EXTRAS=$(python -c "
          try:
              import tomllib
          except ModuleNotFoundError:
              # tomllib is 3.11+; without tomli this script raises on 3.10 and
              # the job silently installs no reference library at all
              import tomli as tomllib
          import pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          extras = [k for k in data['project']['optional-dependencies']
                    if k.startswith('bench-')]
          print(','.join(extras))
          ")
          echo "Bench extras: $(echo "$BENCH_EXTRAS" | tr ',' ' ')"
          # Resolve every extra in one call. If that fails on some interpreter,
          # fall back to one extra per pip call so a single conflicting or
          # unavailable pin cannot leave the job with no reference library at
          # all, which is how 3.10 used to compare nothing.
          pip install ".[$BENCH_EXTRAS]" || {
            echo "::warning::combined install failed, retrying one extra at a time"
            for extra in $(echo "$BENCH_EXTRAS" | tr ',' ' '); do
              pip install ".[$extra]" || echo "::warning::extra $extra unavailable on $(python -V 2>&1)"
            done
          }
      - name: Install the TOON reference at its pinned commit
        # Required, not best-effort: with toon_format absent the toon
        # comparisons skip and the job reports success having compared nothing
        # (issue #183). The pin lives in requirements-bench-toon.txt, not in a
        # pyproject extra, because PyPI rejects direct URLs in published
        # metadata.
        run: |
          pip install -r requirements-bench-toon.txt
          python -c "import toon_format; print('toon_format', toon_format.__version__)"
      - name: Run correctness tests
        run: pytest --ignore-glob="*/test_*_benchmark.py" -v -rs
