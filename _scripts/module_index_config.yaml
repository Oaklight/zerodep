# Doc-specific metadata for module index generation.
# Source of truth for: display categories, module ordering, descriptions,
# benchmark targets, and doc-page overrides.
# Runtime data (version, last_updated, deps) comes from manifest.json.
#
# Usage: python _scripts/generate_module_index.py

# -- Ordered category definitions --
# Each entry defines a doc category with display names and its member
# modules in display order.

categories:
  - id: network
    name_en: "Web & Networking"
    name_zh: "网络与通信"
    modules: [httpclient, sse, httpserver, useragent, websocket]

  - id: protocol
    name_en: "Agent Protocols"
    name_zh: "智能体协议"
    modules: [jsonrpc, a2a, acp, skills, llmstxt, cdp]

  - id: serialization
    name_en: "Serialization"
    name_zh: "序列化"
    modules: [xml, yaml, jsonc, toon, frontmatter, protobuf]

  - id: validation
    name_en: "Validation"
    name_zh: "数据验证"
    modules: [validate, jsonschema, semver]

  - id: text
    name_en: "Text & Search"
    name_zh: "文本与搜索"
    modules: [markdown, soup, readability, diff, sparse_search, synctex]

  - id: config
    name_en: "Configuration"
    name_zh: "配置"
    modules: [dotenv, config]

  - id: terminal
    name_en: "CLI & Terminal"
    name_zh: "命令行与终端"
    modules: [ansi, tabulate, prompt]

  - id: crypto
    name_en: "Security"
    name_zh: "安全"
    modules: [aes]

  - id: image
    name_en: "Image"
    name_zh: "图像"
    modules: [png, qr]

  - id: process
    name_en: "Process & Execution"
    name_zh: "进程与执行"
    modules: [retry, scheduler, runner, filelock]

  - id: storage
    name_en: "Storage"
    name_zh: "存储"
    modules: [cache, persistdict]

  - id: devtools
    name_en: "Dev Tools"
    name_zh: "开发工具"
    modules: [structlog, vcs, depdetect]

# -- Per-module doc metadata --
# Keys: desc_en, desc_zh (required), benchmark (optional, default "--"),
#        doc_page (optional, default "{name}.md").

modules:
  httpclient:
    benchmark: httpx
    desc_en: "Sync + async REST client with connection pooling, proxy, and auth"
    desc_zh: "同步 + 异步 REST 客户端（连接池、代理、认证）"
  sse:
    benchmark: httpx-sse
    desc_en: "Server-Sent Events client with auto-reconnect"
    desc_zh: "Server-Sent Events 客户端（自动重连）"
  jsonrpc:
    benchmark: jsonrpcserver
    desc_en: "JSON-RPC 2.0 protocol: data types, dispatcher, async transport"
    desc_zh: "JSON-RPC 2.0 协议：数据类型、分发器、异步传输"
  a2a:
    benchmark: a2a-python
    desc_en: "Google A2A protocol: JSON-RPC 2.0, SSE streaming, task management"
    desc_zh: "Google A2A 协议：JSON-RPC 2.0、SSE 流式传输、任务管理"
  acp:
    benchmark: acp-python
    desc_en: "Anthropic ACP protocol: JSON-RPC 2.0 over stdio, async client/agent"
    desc_zh: "Anthropic ACP 协议：JSON-RPC 2.0 over stdio、异步客户端/代理"
  skills:
    desc_en: "Agent Skills runtime: parse, discover, manage, select skills"
    desc_zh: "Agent Skills 运行时：解析、发现、管理、选择技能"
  llmstxt:
    desc_en: "llms.txt parser and markdown URL candidate finder"
    desc_zh: "llms.txt 解析器与 Markdown URL 候选发现"
  png:
    benchmark: Pillow
    desc_en: "PNG/BMP image codec with matrix compression API"
    desc_zh: "PNG/BMP 图像编解码器（矩阵压缩 API）"
  xml:
    benchmark: xmltodict
    desc_en: "XML ↔ dict converter with fault-tolerant parsing and LLM tag extraction"
    desc_zh: "XML ↔ 字典转换器（容错解析、LLM 标签提取）"
  yaml:
    benchmark: PyYAML
    desc_en: "YAML parser and serializer (common subset)"
    desc_zh: "YAML 解析与序列化（常用子集）"
  jsonc:
    benchmark: commentjson
    desc_en: "JSONC parser (JSON with comments and trailing commas)"
    desc_zh: "JSONC 解析（JSON + 注释 + 尾逗号）"
  toon:
    benchmark: toon_format
    desc_en: "TOON (Token-Oriented Object Notation) encoder/decoder"
    desc_zh: "TOON（面向 Token 的对象表示法）编码器/解码器"
  frontmatter:
    benchmark: python-frontmatter
    desc_en: "Frontmatter parser and serializer (YAML/TOML/JSON)"
    desc_zh: "Frontmatter 解析与序列化（YAML/TOML/JSON）"
  protobuf:
    benchmark: protobuf
    desc_en: "Proto3 encoder/decoder using Python dataclass schemas"
    desc_zh: "Proto3 编解码器（Python dataclass schema）"
  validate:
    benchmark: pydantic
    desc_en: "Runtime TypedDict/dataclass validator with JSON Schema generation"
    desc_zh: "TypedDict/dataclass 运行时验证器 + JSON Schema 生成"
  jsonschema:
    benchmark: allof-merge
    desc_en: "JSON Schema flattening & sanitization (`$ref`, `allOf`, `anyOf`)"
    desc_zh: "JSON Schema 展平与清理（`$ref`、`allOf`、`anyOf`）"
  semver:
    benchmark: packaging
    desc_en: "PEP 440 version parser and comparator"
    desc_zh: "PEP 440 版本解析与比较器"
  markdown:
    benchmark: mistune
    desc_en: "Markdown to HTML renderer (CommonMark subset + GFM tables)"
    desc_zh: "Markdown → HTML 渲染器（CommonMark 子集 + GFM 表格）"
  soup:
    benchmark: beautifulsoup4
    desc_en: "HTML parser with BeautifulSoup-like API (find, select, CSS selectors)"
    desc_zh: "类 BeautifulSoup API 的 HTML 解析器（find、select、CSS 选择器）"
  readability:
    benchmark: readability-lxml
    desc_en: "Article content extractor ported from Mozilla Readability.js"
    desc_zh: "文章正文提取器（移植自 Mozilla Readability.js）"
  diff:
    benchmark: unidiff
    desc_en: "Unified diff parser, patch apply/reverse, three-way merge"
    desc_zh: "Unified diff 解析、补丁应用/反转、三方合并"
  sparse_search:
    benchmark: rank-bm25
    desc_en: "BM25/BM25+/BM25L/BM25F + TF-IDF full-text search with Bayesian calibration, RRF fusion, MMR diversity"
    desc_zh: "BM25/BM25+/BM25L/BM25F + TF-IDF 全文搜索（贝叶斯校准、RRF 融合、MMR 多样性）"
  dotenv:
    benchmark: python-dotenv
    desc_en: ".env file parser (load_dotenv, dotenv_values)"
    desc_zh: ".env 文件解析（load_dotenv, dotenv_values）"
  config:
    benchmark: python-decouple
    desc_en: "Unified config loader (env vars, .env, JSON/YAML/TOML/INI)"
    desc_zh: "统一配置加载器（环境变量、.env、JSON/YAML/TOML/INI）"
  ansi:
    desc_en: "ANSI terminal styling: colors, attributes, detection, strip/visible_len"
    desc_zh: "ANSI 终端样式：颜色、属性、检测、strip/visible_len"
  tabulate:
    benchmark: tabulate
    desc_en: "Table formatting with multiple output styles"
    desc_zh: "多种输出样式的表格格式化"
  prompt:
    benchmark: questionary
    desc_en: "Interactive CLI prompts (confirm, select, text)"
    desc_zh: "交互式 CLI 提示（confirm、select、text）"
  aes:
    benchmark: pycryptodome
    desc_en: "AES encryption: ECB, CBC, CTR, GCM modes (pure Python + OpenSSL via ctypes)"
    desc_zh: "AES 加密：ECB、CBC、CTR、GCM 模式（纯 Python + OpenSSL ctypes）"
  qr:
    benchmark: qrcode
    desc_en: "QR Code generation with terminal rendering"
    desc_zh: "QR Code 生成与终端渲染"
  cache:
    benchmark: cachetools
    desc_en: "In-memory cache with TTL, LRU/LFU eviction, and async support"
    desc_zh: "内存缓存（TTL、LRU/LFU 淘汰、异步支持）"
  retry:
    benchmark: tenacity
    desc_en: "Decorator-based retry with configurable backoff strategies"
    desc_zh: "装饰器式自动重试（退避、抖动、过滤）"
  scheduler:
    benchmark: APScheduler
    desc_en: "In-process task scheduler with cron, interval, one-shot triggers"
    desc_zh: "进程内任务调度器（cron、间隔、一次性触发）"
  runner:
    desc_en: "Structured subprocess execution with timeout escalation"
    desc_zh: "结构化子进程执行（超时升级）"
  filelock:
    desc_en: "Cross-platform advisory file lock (fcntl/msvcrt)"
    desc_zh: "跨平台咨询式文件锁（fcntl/msvcrt）"
  structlog:
    benchmark: structlog
    desc_en: "Structured logging with pretty console output"
    desc_zh: "结构化日志与彩色控制台输出"
  vcs:
    desc_en: "Git/Hg/Jujutsu CLI wrapper (diff, status, log, blame)"
    desc_zh: "Git/Hg/Jujutsu CLI 包装器（diff、status、log、blame）"
  persistdict:
    desc_en: "Persistent dict with pluggable backends (JSON, SQLite)"
    desc_zh: "持久化字典（JSON / SQLite 后端）"
  depdetect:
    desc_en: "Dependency detection and verification"
    desc_zh: "依赖检测与验证"
  useragent:
    benchmark: ua-generator
    desc_en: "Lightweight Chrome/Edge User-Agent generator with Client Hints"
    desc_zh: "轻量级 Chrome/Edge User-Agent 生成器（含 Client Hints）"
  synctex:
    desc_en: "SyncTeX inverse-search parser (PDF position → source location)"
    desc_zh: "SyncTeX 反向搜索解析器（PDF 位置 → 源代码位置）"
  httpserver:
    benchmark: flask / microdot / bottle
    desc_en: "Async HTTP server with decorator-based routing, streaming, and static files"
    desc_zh: "异步 HTTP 服务器（装饰器路由、流式响应、静态文件）"
  websocket:
    benchmark: websockets
    desc_en: "RFC 6455 WebSocket client with sync + async support"
    desc_zh: "RFC 6455 WebSocket 客户端（同步 + 异步）"
  cdp:
    benchmark: websockets
    desc_en: "Chrome DevTools Protocol client for headless browser automation"
    desc_zh: "Chrome DevTools Protocol 客户端（无头浏览器自动化）"
