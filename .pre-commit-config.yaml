repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty check
        description: Type check with ty.
        entry: ty check
        language: system
        pass_filenames: false
        require_serial: true
        types: [python]

      - id: manifest-check
        name: manifest check
        description: Fail when manifest.json is stale (run make manifest).
        entry: python zerodep.py manifest --check
        language: system
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v5.1.0
    hooks:
      - id: complexipy
        files: ^.*\.py$
        exclude: ^_vendor/
        args: [-mx, "45"]
