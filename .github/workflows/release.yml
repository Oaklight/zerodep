name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty for auto CalVer YYYY.M.D)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  quality:
    uses: ./.github/workflows/lint-test.yml
    with:
      python-versions: '["3.12"]'

  release:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="$(date +%Y.%-m.%-d)"
          fi
          if git tag -l "v${VER}" | grep -q .; then
            echo "::error::Tag v${VER} already exists"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VER}"

      - name: Check module versions
        run: |
          python -m zerodep version-check --strict

      - name: Regenerate manifest
        run: |
          python -m zerodep manifest

      - name: Bump project version
        run: |
          VER="${{ steps.version.outputs.version }}"
          sed -i "s/^version = .*/version = \"${VER}\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"${VER}\"/" zerodep.py

      - name: Commit and tag
        run: |
          VER="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "release: v${VER}"
          fi
          git tag "v${VER}"
          git push origin master --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          gh release create "v${VER}" \
            --title "v${VER}" \
            --generate-notes

      - name: Trigger benchmark
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          gh workflow run benchmark.yml --ref "v${VER}" || echo "::warning::Benchmark trigger failed"

  pypi:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for CLI changes
        id: check
        run: |
          CURRENT_TAG="v${{ needs.release.outputs.version }}"
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -1)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found — first release, publishing"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing ${PREV_TAG}..${CURRENT_TAG}"

          CLI_DIFF=$(git diff "$PREV_TAG".."$CURRENT_TAG" -- zerodep.py \
            | grep '^[+-]' | grep -v '^[+-][+-][+-]' | grep -v '__version__' || true)
          TOML_DIFF=$(git diff "$PREV_TAG".."$CURRENT_TAG" -- pyproject.toml \
            | grep '^[+-]' | grep -v '^[+-][+-][+-]' | grep -v '^[+-]version = ' || true)

          if [ -n "$CLI_DIFF" ] || [ -n "$TOML_DIFF" ]; then
            echo "Substantive changes detected:"
            echo "--- zerodep.py diff (excluding version) ---"
            echo "$CLI_DIFF"
            echo "--- pyproject.toml diff (excluding version) ---"
            echo "$TOML_DIFF"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only version bumps — skipping PyPI publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        if: steps.check.outputs.changed == 'true'
        run: |
          pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
