name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty for auto CalVer YYYY.M.D)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pytest-asyncio pytest-benchmark ruff

      - name: Install reference libraries
        continue-on-error: true
        run: |
          # Dynamically extract all bench-* extras from pyproject.toml
          # (bench-toon excluded — only available from git, installed separately)
          BENCH_EXTRAS=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          extras = [k for k in data['project']['optional-dependencies']
                    if k.startswith('bench-') and k != 'bench-toon']
          print(','.join(extras))
          ")
          echo "Installing extras: $BENCH_EXTRAS"
          pip install ".[$BENCH_EXTRAS]"
          pip install "toon_format @ git+https://github.com/toon-format/toon-python.git" || true

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest --ignore-glob="*/test_*_benchmark.py" -v

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="$(date +%Y.%-m.%-d)"
          fi
          if git tag -l "v${VER}" | grep -q .; then
            echo "::error::Tag v${VER} already exists"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VER}"

      - name: Bump module versions
        run: |
          python -m zerodep bump || echo "No modules to bump"

      - name: Bump project version
        run: |
          VER="${{ steps.version.outputs.version }}"
          sed -i "s/^version = .*/version = \"${VER}\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"${VER}\"/" zerodep.py

      - name: Commit and tag
        run: |
          VER="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "release: v${VER}"
          fi
          git tag "v${VER}"
          git push origin master --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          gh release create "v${VER}" \
            --title "v${VER}" \
            --generate-notes
