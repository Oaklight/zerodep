# Read the Docs configuration file for Zensical
# See https://docs.readthedocs.com/platform/latest/intro/zensical.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    post_checkout:
      - git fetch origin master --depth=1
      - for d in aes qr httpclient dotenv yaml jsonc structlog retry toon; do git checkout FETCH_HEAD -- "$d/" 2>/dev/null || true; done
    install:
      - pip install -r requirements.txt
    build:
      html:
        - zensical build
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
