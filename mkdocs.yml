site_name: zerodep
site_description: 零依赖、单文件的 Python 常用库实现
site_author: Peng Ding
site_url: https://zerodep.readthedocs.io/zh-cn/
repo_name: Oaklight/zerodep
repo_url: https://github.com/Oaklight/zerodep
copyright: Copyright &copy; 2026 Peng Ding

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 跟随系统设置
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ../aes
            - ../qr
            - ../httpclient
            - ../dotenv
            - ../yaml
            - ../jsonc
            - aes
            - qr
            - httpclient
            - dotenv
            - yaml
            - jsonc
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Oaklight/zerodep
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: 中文
      link: /zh-cn/
      lang: zh

nav:
  - 首页: index.md
  - 模块:
      - AES 加密: modules/aes.md
      - QR 二维码: modules/qr.md
      - HTTP 客户端: modules/http.md
      - Dotenv 环境变量: modules/dotenv.md
      - YAML 解析器: modules/yaml.md
      - JSONC 解析器: modules/jsonc.md
  - API 参考:
      - AES: api/aes.md
      - QR 二维码: api/qr.md
      - HTTP 客户端: api/http.md
      - Dotenv: api/dotenv.md
      - YAML: api/yaml.md
      - JSONC: api/jsonc.md
  - 性能测试:
      - AES: benchmarks/aes.md
      - QR 二维码: benchmarks/qr.md
      - HTTP 客户端: benchmarks/http.md
      - Dotenv: benchmarks/dotenv.md
      - YAML: benchmarks/yaml.md
      - JSONC: benchmarks/jsonc.md
  - 更新日志: changelog.md
