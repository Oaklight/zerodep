[project]
name = "zerodep"
version = "0.3.0"
description = "Zero-dependency, single-file Python implementations of popular libraries"
authors = [{ name = "Peng Ding" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
zerodep = "zerodep:main"

[project.urls]
Repository = "https://github.com/Oaklight/zerodep"
Issues = "https://github.com/Oaklight/zerodep/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
]
# Reference libraries for correctness and benchmark comparisons
bench-aes = [
    "pycryptodome>=3.20.0",
]
bench-qr = [
    "qrcode>=7.0",
    "Pillow>=10.0.0",
]
bench-http = [
    "httpx>=0.27.0",
]
bench-dotenv = [
    "python-dotenv>=1.0.0",
]
bench-yaml = [
    "PyYAML>=6.0",
]
bench-jsonc = [
    "commentjson>=0.9.0",
]
bench-structlog = [
    "structlog>=24.0.0",
]
bench-retry = [
    "tenacity>=8.0.0",
]
bench-toon = [
    "toon_format @ git+https://github.com/toon-format/toon-python.git",
]
bench-tabulate = [
    "tabulate>=0.9.0",
]
bench-soup = [
    "beautifulsoup4>=4.12.0",
]
bench-validate = [
    "pydantic>=2.0.0",
]
bench-sse = [
    "httpx-sse>=0.4.0",
    "httpx>=0.27.0",
]
bench-markdown = [
    "mistune>=3.0.0",
]
bench-diff = [
    "unidiff>=0.7.0",
]
bench-scheduler = [
    "APScheduler>=3.10.0",
    "schedule>=1.2.0",
    "croniter>=1.3.0",
]
bench-search = [
    "rank-bm25>=0.2.2",
]
bench-frontmatter = [
    "python-frontmatter>=1.1.0",
]
bench-config = [
    "python-decouple>=3.8",
]
bench-cache = [
    "cachetools>=5.0.0",
]
bench-xml = [
    "xmltodict>=0.13.0",
]
bench-jsonrpc = [
    "jsonrpcserver>=5.0.0",
]
bench-a2a = [
    "a2a-protocol>=0.1.0",
]
bench-acp = [
    "agent-client-protocol>=0.9.0",
]
dev = [
    "zerodep[test,bench-aes,bench-qr,bench-http,bench-dotenv,bench-yaml,bench-jsonc,bench-structlog,bench-retry,bench-toon,bench-tabulate,bench-soup,bench-validate,bench-sse,bench-markdown,bench-diff,bench-scheduler,bench-search,bench-frontmatter,bench-config,bench-cache,bench-xml,bench-jsonrpc,bench-a2a,bench-acp]",
]

[tool.pytest.ini_options]
testpaths = ["aes", "qr", "httpclient", "dotenv", "yaml", "jsonc", "structlog", "retry", "toon", "tabulate", "soup", "prompt", "validate", "sse", "markdown", "diff", "vcs", "ansi", "scheduler", "search", "frontmatter", "config", "cache", "runner", "xml", "jsonrpc", "a2a", "acp", "skills", "filelock"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"aes/aes.py" = ["E501"]
"aes/aes_openssl.py" = ["E501"]
"qr/qr.py" = ["E501"]
"yaml/yaml.py" = ["E501"]
"validate/validate.py" = ["E501"]
"diff/diff.py" = ["E501"]
"vcs/vcs.py" = ["E501"]
"xml/xml.py" = ["E501"]
"a2a/a2a.py" = ["E501"]
"acp/acp.py" = ["E501"]
"**/test_*.py" = ["E402"]

[tool.ty.environment]
extra-paths = [
    "./aes",
    "./ansi",
    "./diff",
    "./dotenv",
    "./httpclient",
    "./jsonc",
    "./markdown",
    "./prompt",
    "./qr",
    "./retry",
    "./soup",
    "./sse",
    "./structlog",
    "./tabulate",
    "./toon",
    "./validate",
    "./vcs",
    "./yaml",
    "./scheduler",
    "./search",
    "./frontmatter",
    "./config",
    "./cache",
    "./runner",
    "./xml",
    "./jsonrpc",
    "./a2a",
    "./acp",
    "./skills",
    "./filelock",
]
