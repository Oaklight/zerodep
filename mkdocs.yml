site_name: zerodep
site_description: 零依赖、单文件的 Python 常用库实现
site_author: Peng Ding
site_url: https://zerodep.readthedocs.io/zh-cn/
repo_name: Oaklight/zerodep
repo_url: https://github.com/Oaklight/zerodep
copyright: Copyright &copy; 2026 Peng Ding

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 跟随系统设置
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ../aes
            - ../qr
            - ../httpclient
            - ../dotenv
            - ../yaml
            - ../jsonc
            - ../structlog
            - ../retry
            - ../toon
            - ../sse
            - ../tabulate
            - ../soup
            - ../prompt
            - ../validate
            - ../markdown
            - ../diff
            - ../vcs
            - ../ansi
            - ../scheduler
            - ../sparse_search
            - ../frontmatter
            - ../config
            - ../cache
            - ../runner
            - ../xml
            - ../a2a
            - ../jsonrpc
            - ../acp
            - ../skills
            - ../filelock
            - ../persistdict
            - ../protobuf
            - ../depdetect
            - ../semver
            - aes
            - qr
            - httpclient
            - dotenv
            - yaml
            - jsonc
            - structlog
            - retry
            - toon
            - sse
            - tabulate
            - soup
            - prompt
            - validate
            - markdown
            - diff
            - vcs
            - ansi
            - scheduler
            - sparse_search
            - frontmatter
            - config
            - cache
            - runner
            - xml
            - a2a
            - jsonrpc
            - acp
            - skills
            - filelock
            - persistdict
            - protobuf
            - depdetect
            - semver
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Oaklight/zerodep
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: 中文
      link: /zh-cn/
      lang: zh

