site_name: zerodep
site_description: 零依赖、单文件的 Python 常用库实现
site_author: Peng Ding
site_url: https://zerodep.readthedocs.io/zh-cn/
repo_name: Oaklight/zerodep
repo_url: https://github.com/Oaklight/zerodep
copyright: Copyright &copy; 2026 Peng Ding

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 跟随系统设置
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ../aes
            - ../qr
            - ../httpclient
            - ../dotenv
            - ../yaml
            - ../jsonc
            - ../structlog
            - ../retry
            - ../toon
            - ../sse
            - ../tabulate
            - ../soup
            - ../prompt
            - ../validate
            - ../markdown
            - ../diff
            - ../vcs
            - ../ansi
            - ../scheduler
            - ../search
            - aes
            - qr
            - httpclient
            - dotenv
            - yaml
            - jsonc
            - structlog
            - retry
            - toon
            - sse
            - tabulate
            - soup
            - prompt
            - validate
            - markdown
            - diff
            - vcs
            - ansi
            - scheduler
            - search
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Oaklight/zerodep
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: 中文
      link: /zh-cn/
      lang: zh

nav:
  - 首页: index.md
  - 模块:
      - 网络与通信:
          - HTTP 客户端: modules/http.md
          - SSE 客户端: modules/sse.md
      - 数据格式:
          - YAML 解析器: modules/yaml.md
          - JSONC 解析器: modules/jsonc.md
          - TOON 序列化: modules/toon.md
      - 数据验证:
          - 验证器: modules/validate.md
      - 文本与标记:
          - Markdown 渲染器: modules/markdown.md
          - HTML 解析器: modules/soup.md
          - Diff 差异工具: modules/diff.md
      - 搜索与检索:
          - 稀疏搜索: modules/search.md
      - 配置:
          - Dotenv 环境变量: modules/dotenv.md
      - 命令行与终端:
          - ANSI 终端样式: modules/ansi.md
          - 表格格式化: modules/tabulate.md
          - 交互式提示: modules/prompt.md
      - 安全与编码:
          - AES 加密: modules/aes.md
          - QR 二维码: modules/qr.md
      - 基础设施与工具:
          - 重试: modules/retry.md
          - 任务调度器: modules/scheduler.md
          - 结构化日志: modules/structlog.md
          - VCS 版本控制: modules/vcs.md
  - API 参考:
      - 网络与通信:
          - HTTP 客户端: api/http.md
          - SSE: api/sse.md
      - 数据格式:
          - YAML: api/yaml.md
          - JSONC: api/jsonc.md
          - TOON: api/toon.md
      - 数据验证:
          - 验证器: api/validate.md
      - 文本与标记:
          - Markdown: api/markdown.md
          - Soup: api/soup.md
          - Diff: api/diff.md
      - 搜索与检索:
          - 稀疏搜索: api/search.md
      - 配置:
          - Dotenv: api/dotenv.md
      - 命令行与终端:
          - ANSI: api/ansi.md
          - Tabulate: api/tabulate.md
          - Prompt: api/prompt.md
      - 安全与编码:
          - AES: api/aes.md
          - QR 二维码: api/qr.md
      - 基础设施与工具:
          - 重试: api/retry.md
          - 调度器: api/scheduler.md
          - 结构化日志: api/structlog.md
          - VCS: api/vcs.md
  - 性能测试:
      - 网络与通信:
          - HTTP 客户端: benchmarks/http.md
          - SSE 客户端: benchmarks/sse.md
      - 数据格式:
          - YAML: benchmarks/yaml.md
          - JSONC: benchmarks/jsonc.md
          - TOON: benchmarks/toon.md
      - 数据验证:
          - 验证器: benchmarks/validate.md
      - 文本与标记:
